# Сбор и проверка прокси на серверах GitHub. Память о проверенных - в кэше Actions (state/state.json).
# Два режима:
#   alive - каждые 15 минут: перепроверка уже известных рабочих (без сбора источников), ~1 минута
#   full  - каждые 2 часа: сбор новых из источников + проверка новых и рабочих
# Секреты: RESULT_URL (вебхук n8n), WEBHOOK_TOKEN (необязательно).
# Репозиторий должен быть ПУБЛИЧНЫМ - тогда минуты GitHub Actions не ограничены.
name: check-proxies
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "4 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full - сбор новых и проверка, alive - только перепроверка рабочих"
        default: "full"
concurrency:
  group: check-proxies
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install aiohttp aiohttp-socks
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: proxy-state-${{ github.run_id }}
          restore-keys: proxy-state-
      - run: python check.py
        env:
          RESULT_URL: ${{ secrets.RESULT_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          CONCURRENCY: "1000"
          TIMEOUT: "8"
          # запуск по расписанию «раз в 2 часа» или вручную с full -> полный режим, иначе быстрый
          MODE: ${{ (github.event.schedule == '4 */2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'alive')) && 'full' || 'alive' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: proxy-state-${{ github.run_id }}
